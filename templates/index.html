<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>問合せモック</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202b28;
      background: #f3f5f1;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background: radial-gradient(ellipse at 85% 4%, #dce8df 0, transparent 34%), #f3f5f1;
    }

    main {
      width: min(100%, 720px);
      margin: 8vh auto 0;
    }

    h1 { margin: 0 0 28px; font-size: 28px; font-weight: 650; }

    form, #result {
      border: 1px solid #d6ddd7;
      border-radius: 8px;
      background: #fff;
    }

    form { padding: 18px; }

    textarea {
      display: block;
      width: 100%;
      min-height: 128px;
      resize: vertical;
      border: 0;
      outline: 0;
      color: inherit;
      font: inherit;
      line-height: 1.6;
    }

    textarea::placeholder { color: #87918a; }

    .form-footer {
      display: flex;
      justify-content: flex-end;
      padding-top: 12px;
      border-top: 1px solid #edf0ed;
    }

    button {
      min-width: 88px;
      min-height: 40px;
      border: 0;
      border-radius: 5px;
      background: #245c49;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #194b39; }
    button:disabled { cursor: wait; opacity: .65; }

    #result {
      margin-top: 20px;
      padding: 20px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    #answer > :first-child { margin-top: 0; }
    #answer > :last-child { margin-bottom: 0; }
    #answer a { color: #245c49; }

    #sources {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #d6ddd7;
    }

    #sources h2 { margin: 0 0 12px; font-size: 16px; }

    #source-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .source-item {
      padding: 10px 12px;
      border-left: 4px solid #c27a2c;
      background: #fff8eb;
    }

    .source-item a { color: #245c49; font-weight: 650; }
    .source-url { display: block; color: #59665f; font-size: 13px; overflow-wrap: anywhere; }

    #result[hidden] { display: none; }
    #result[data-error="true"] { border-color: #d7a8a2; color: #842e24; }

    @media (max-width: 520px) {
      body { padding: 24px 16px; }
      main { margin-top: 5vh; }
      h1 { font-size: 24px; }
      form { padding: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>AI問合せ（モック）</h1>
    <form id="question-form">
      <textarea id="question" name="question" placeholder="質問を入力してください" required></textarea>
      <div class="form-footer">
        <button id="submit-button" type="submit">送信</button>
      </div>
    </form>
    <section id="result" aria-live="polite" hidden>
      <div id="answer"></div>
      <div id="sources" hidden>
        <h2>根拠資料</h2>
        <ul id="source-list"></ul>
      </div>
    </section>
  </main>
  <script>
    const form = document.querySelector("#question-form");
    const question = document.querySelector("#question");
    const button = document.querySelector("#submit-button");
    const result = document.querySelector("#result");
    const answer = document.querySelector("#answer");
    const sources = document.querySelector("#sources");
    const sourceList = document.querySelector("#source-list");

    function showSources(items) {
      sourceList.replaceChildren();
      for (const source of items) {
        const item = document.createElement("li");
        item.className = "source-item";
        const link = document.createElement("a");
        link.href = source.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = source.title || source.url;
        const url = document.createElement("span");
        url.className = "source-url";
        url.textContent = source.url;
        item.append(link, url);
        sourceList.append(item);
      }
      sources.hidden = items.length === 0;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "送信中";
      result.hidden = false;
      result.removeAttribute("data-error");
      answer.textContent = "回答を取得しています...";
      showSources([]);

      try {
        const response = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: question.value }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "回答を取得できませんでした。");
        answer.innerHTML = data.answer_html;
        showSources(data.sources || []);
      } catch (error) {
        result.dataset.error = "true";
        answer.textContent = error.message || "通信に失敗しました。";
      } finally {
        button.disabled = false;
        button.textContent = "送信";
      }
    });
  </script>
</body>
</html>
